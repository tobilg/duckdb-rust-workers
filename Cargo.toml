[package]
name = "duckdb-worker-eval"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
worker = { path = "vendor/workers-rs/worker" }
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "=2.5.8"
futures-util = "0.3.31"

[profile.release]
opt-level = "z"
panic = "abort"
lto = "thin"
codegen-units = 1
